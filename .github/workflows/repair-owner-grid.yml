name: repair-owner-grid

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect list grid
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/ad_network/bots/owner_bot.py")
          text = path.read_text(encoding="utf-8")
          old = "if a=='lists':await list_menu(event,db);return"
          new = "if a=='lists':\n                from .owner_list_grid import list_management_keyboard\n                await reply(event,'🗂 مدیریت لیست‌ها\\n━━━━━━━━━━━━━━━━━━━━\\nنوع لیست را انتخاب کنید:',inline_keypad=list_management_keyboard());return"
          if old not in text:
              raise SystemExit("target routing not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/repair-owner-grid.yml").unlink()
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ad_network/bots/owner_bot.py .github/workflows/repair-owner-grid.yml
          git diff --cached --quiet && exit 0
          git commit -m "Connect owner list management grid"
          git push
