name: repair-owner-menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair owner bot
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/ad_network/bots/owner_bot.py")
          text = path.read_text(encoding="utf-8")
          broken = "CampaignTarget.published_at.is_not(None)); done="
          fixed = "CampaignTarget.published_at.is_not(None))); done="
          if broken in text:
              text = text.replace(broken, fixed, 1)
          old = "'📊 داشبورد':'dashboard','🗂 لیست‌ها':'lists'"
          new = "'📊 داشبورد':'dashboard','🗂 لیست‌ها':'lists','🗂 مدیریت لیست‌ها':'lists'"
          if old in text and "'🗂 مدیریت لیست‌ها':'lists'" not in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/repair-owner-menu.yml").unlink()
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ad_network/bots/owner_bot.py .github/workflows/repair-owner-menu.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix owner list menu routing"
          git push
