[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubika-ad-network"
version = "0.2.0"
description = "Smart Rubika advertising network"
requires-python = ">=3.11"
dependencies = [
  "fastrub>=6.1.1",
  "SQLAlchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.7.0",
  "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
