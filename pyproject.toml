[project]
name = "rubika-ad-network"
version = "0.1.0"
description = "Smart Rubika advertising network"
requires-python = ">=3.11"
dependencies = [
  "fast-rub>=6.1.1",
  "SQLAlchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.7.0",
  "alembic>=1.14.0",
]

[project.optional-dependencies]
redis = ["redis>=5.2.1"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[tool.ruff]
line-length = 100

target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
